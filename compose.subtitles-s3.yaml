# Optional after compose.rebuild.yaml; configure before spreading playback across hosts.
services:
  playback:
    environment:
      SUBTITLE_FILE_BACKEND: s3
      SUBTITLES_S3_BUCKET: ${SUBTITLES_S3_BUCKET:?Set the private subtitle bucket}
      SUBTITLES_S3_REGION: ${SUBTITLES_S3_REGION:?Set its region}
      SUBTITLES_S3_ENDPOINT: ${SUBTITLES_S3_ENDPOINT:-}
      SUBTITLES_S3_CREDENTIALS_FILE: /run/secrets/subtitles-s3.json
    secrets: [subtitles-s3.json]
secrets:
  subtitles-s3.json:
    file: ${SUBTITLES_S3_CREDENTIALS_FILE:?Select the dedicated credential file}
