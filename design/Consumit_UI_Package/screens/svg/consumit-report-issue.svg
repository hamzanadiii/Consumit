  <rect x="1024" y="486" width="326" height="142" rx="7" fill="#19191E"/><rect x="1040" y="502" width="82" height="110" rx="5" fill="#2B1E29"/><circle cx="1081" cy="542" r="24" fill="#A79CFF" fill-opacity=".68"/><path d="M1040 612 1081 548 1122 600V612H1040Z" fill="#101116"/><text x="1140" y="520" fill="#FF5D38" font-family="DejaVu Sans" font-size="8" font-weight="800">SERIES</text><text x="1140" y="548" fill="#F4F0E8" font-family="Bitstream Charter, DejaVu Serif" font-size="20">Violet Hours</text><text x="1140" y="570" fill="#AAA69F" font-family="DejaVu Sans" font-size="8">S1 E3 · Quiet Water</text><text x="1140" y="596" fill="#77736E" font-family="DejaVu Sans" font-size="8">Attempted 02:14 ago</text>
  <g font-family="DejaVu Sans"><text x="1024" y="674" fill="#77736E" font-size="8" font-weight="800">SOURCE</text><text x="1350" y="674" text-anchor="end" fill="#F4F0E8" font-size="9">Recommended source</text><line x1="1024" y1="694" x2="1350" y2="694" stroke="#FFF" stroke-opacity=".07"/><text x="1024" y="730" fill="#77736E" font-size="8" font-weight="800">BROWSER</text><text x="1350" y="730" text-anchor="end" fill="#F4F0E8" font-size="9">Safari 19 · macOS</text><line x1="1024" y1="750" x2="1350" y2="750" stroke="#FFF" stroke-opacity=".07"/><text x="1024" y="786" fill="#77736E" font-size="8" font-weight="800">REGION</text><text x="1350" y="786" text-anchor="end" fill="#F4F0E8" font-size="9">Morocco</text><line x1="1024" y1="806" x2="1350" y2="806" stroke="#FFF" stroke-opacity=".07"/><text x="1024" y="842" fill="#77736E" font-size="8" font-weight="800">REQUEST ID</text><text x="1350" y="842" text-anchor="end" fill="#F4F0E8" font-size="9">csm_74f2…b18a</text></g>
  <rect x="1024" y="880" width="326" height="210" rx="7" fill="#17171B"/><text x="1048" y="920" fill="#F4F0E8" font-family="DejaVu Sans" font-size="11" font-weight="800">Try before sending</text><circle cx="1051" cy="957" r="4" fill="#B8D86D"/><text x="1065" y="961" fill="#AAA69F" font-family="DejaVu Sans" font-size="9">Backup source 2 is healthy</text><circle cx="1051" cy="994" r="4" fill="#A79CFF"/><text x="1065" y="998" fill="#AAA69F" font-family="DejaVu Sans" font-size="9">Reloading keeps your episode</text><rect x="1048" y="1028" width="134" height="40" rx="6" fill="#F4F0E8"/><text x="1115" y="1053" text-anchor="middle" fill="#111114" font-family="DejaVu Sans" font-size="8" font-weight="900">TRY BACKUP</text><text x="1205" y="1053" fill="#A79CFF" font-family="DejaVu Sans" font-size="8" font-weight="800">RELOAD</text>
  <rect x="1024" y="1110" width="326" height="122" rx="7" fill="#17171B"/><rect x="1024" y="1110" width="3" height="122" fill="#A79CFF"/><text x="1048" y="1147" fill="#F4F0E8" font-family="DejaVu Sans" font-size="10" font-weight="800">Privacy, plainly</text><text x="1048" y="1174" fill="#8F8A84" font-family="DejaVu Sans" font-size="8"><tspan x="1048">Diagnostics are attached only when the</tspan><tspan x="1048" dy="16">toggle is on. Delete them with the ticket.</tspan></text>
  <text x="1024" y="1281" fill="#77736E" font-family="DejaVu Sans" font-size="8" font-weight="800">EXPECTED RESPONSE</text><text x="1024" y="1312" fill="#F4F0E8" font-family="Bitstream Charter, DejaVu Serif" font-size="22">Usually within 24 hours</text><text x="1024" y="1337" fill="#85817C" font-family="DejaVu Sans" font-size="8">Critical mapping errors are often fixed sooner.</text>

  <!-- final note -->
  <line x1="62" y1="1450" x2="1378" y2="1450" stroke="#FFF" stroke-opacity=".08"/>
  <text x="62" y="1504" fill="#F4F0E8" font-family="Bitstream Charter, DejaVu Serif" font-size="24">This report goes to Consumit support—not the external provider.</text><text x="62" y="1536" fill="#85817C" font-family="DejaVu Sans" font-size="9">If the provider itself requests payment, credentials, or an extension, close the frame and report it immediately.</text><text x="1378" y="1530" text-anchor="end" fill="#FF5D38" font-family="DejaVu Sans" font-size="8" font-weight="800">READ EMBED SAFETY</text>

