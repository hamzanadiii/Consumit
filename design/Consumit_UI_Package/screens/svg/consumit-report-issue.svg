  <text x="303" y="52" fill="#B8B5B0" font-family="DejaVu Sans" font-size="14" font-weight="600">Help Center</text><text x="1378" y="51" text-anchor="end" fill="#AAA7A1" font-family="DejaVu Sans" font-size="11" font-weight="700">CLOSE REPORT</text>

  <!-- report hero -->
  <rect y="84" width="1440" height="276" fill="url(#hero)"/><path d="M730 84h250l-54 276H676Z" fill="#17323B" fill-opacity=".33"/><path d="M928 84h260l-58 276H870Z" fill="#4A2746" fill-opacity=".29"/><circle cx="1194" cy="186" r="94" fill="#CF6845" fill-opacity=".2"/><circle cx="1194" cy="186" r="67" fill="none" stroke="#F4F0E8" stroke-opacity=".1"/><path d="M1060 360 1194 141 1318 360Z" fill="#160F14" fill-opacity=".7"/><rect y="84" width="1440" height="276" filter="url(#grain)" opacity=".42"/>
  <text x="62" y="144" fill="#FF5D38" font-family="DejaVu Sans" font-size="10" font-weight="800" letter-spacing="2">HELP US FIND THE BREAK</text><text x="62" y="218" fill="#F4F0E8" font-family="Bitstream Charter, DejaVu Serif" font-size="52">Report an issue</text><text x="62" y="260" fill="#C9C4BC" font-family="DejaVu Sans" font-size="14">Tell us what happened. Consumit already captured the boring technical context.</text><text x="62" y="293" fill="#85817C" font-family="DejaVu Sans" font-size="10">Nothing you type here appears on your profile or friend activity.</text>

  <!-- report form -->
  <text x="62" y="427" fill="#F4F0E8" font-family="Bitstream Charter, DejaVu Serif" font-size="30">What went wrong?</text><text x="62" y="456" fill="#85817C" font-family="DejaVu Sans" font-size="9">Choose the closest match. You can explain the weird part below.</text>
  <g font-family="DejaVu Sans">
    <rect x="62" y="485" width="170" height="76" rx="7" fill="#1B181A" stroke="#FF5D38" stroke-width="1.5"/><circle cx="88" cy="511" r="8" fill="#FF5D38"/><path d="m84 511 3 3 6-7" stroke="#FFF" stroke-width="1.5"/><text x="88" y="542" fill="#F4F0E8" font-size="9" font-weight="800">VIDEO WON’T LOAD</text>
    <rect x="244" y="485" width="170" height="76" rx="7" fill="#121216" stroke="#FFF" stroke-opacity=".11"/><circle cx="270" cy="511" r="8" fill="none" stroke="#77736E"/><text x="270" y="542" fill="#D8D3CB" font-size="9" font-weight="800">WRONG TITLE</text>
    <rect x="426" y="485" width="170" height="76" rx="7" fill="#121216" stroke="#FFF" stroke-opacity=".11"/><circle cx="452" cy="511" r="8" fill="none" stroke="#77736E"/><text x="452" y="542" fill="#D8D3CB" font-size="9" font-weight="800">SUBTITLE ISSUE</text>
    <rect x="608" y="485" width="170" height="76" rx="7" fill="#121216" stroke="#FFF" stroke-opacity=".11"/><circle cx="634" cy="511" r="8" fill="none" stroke="#77736E"/><text x="634" y="542" fill="#D8D3CB" font-size="9" font-weight="800">AUDIO ISSUE</text>
    <rect x="790" y="485" width="170" height="76" rx="7" fill="#121216" stroke="#FFF" stroke-opacity=".11"/><circle cx="816" cy="511" r="8" fill="none" stroke="#77736E"/><text x="816" y="542" fill="#D8D3CB" font-size="9" font-weight="800">SOMETHING ELSE</text>
  </g>

  <text x="62" y="628" fill="#F4F0E8" font-family="Bitstream Charter, DejaVu Serif" font-size="30">What did you see?</text><text x="62" y="657" fill="#85817C" font-family="DejaVu Sans" font-size="9">One or two useful sentences beat a ten-paragraph mystery.</text>
  <rect x="62" y="684" width="898" height="174" rx="8" fill="#0D0D10" stroke="#FFF" stroke-opacity=".15"/><text x="88" y="724" fill="#D6D1C9" font-family="DejaVu Sans" font-size="11"><tspan x="88">The player stays black after loading. I tried the recommended source twice,</tspan><tspan x="88" dy="23">but no controls appeared.</tspan></text><text x="932" y="832" text-anchor="end" fill="#67645F" font-family="DejaVu Sans" font-size="8">116 / 600</text>

  <text x="62" y="925" fill="#F4F0E8" font-family="Bitstream Charter, DejaVu Serif" font-size="30">Anything visual?</text><text x="62" y="954" fill="#85817C" font-family="DejaVu Sans" font-size="9">Optional. Remove names, emails, or anything private before uploading.</text>
  <rect x="62" y="983" width="898" height="132" rx="8" fill="#121216" stroke="#FFF" stroke-opacity=".11" stroke-dasharray="6 6"/><rect x="88" y="1015" width="58" height="58" rx="7" fill="#1A1A1F"/><path d="M104 1057h26l-8-12-7 8-4-5-7 9Z" fill="#A79CFF"/><circle cx="123" cy="1032" r="4" fill="#FF5D38"/><text x="166" y="1034" fill="#F4F0E8" font-family="DejaVu Sans" font-size="10" font-weight="800">Add screenshot or short screen recording</text><text x="166" y="1056" fill="#77736E" font-family="DejaVu Sans" font-size="8">PNG, JPG, or MP4 · up to 25 MB</text><rect x="800" y="1028" width="130" height="40" rx="6" fill="#1A1A1F" stroke="#FFF" stroke-opacity=".14"/><text x="865" y="1053" text-anchor="middle" fill="#D9D4CC" font-family="DejaVu Sans" font-size="8" font-weight="800">CHOOSE FILE</text>

  <!-- submit area -->
  <rect x="62" y="1184" width="898" height="192" rx="8" fill="#121216" stroke="#FFF" stroke-opacity=".1"/>
  <text x="88" y="1226" fill="#F4F0E8" font-family="DejaVu Sans" font-size="11" font-weight="800">Include technical diagnostics</text><text x="88" y="1248" fill="#85817C" font-family="DejaVu Sans" font-size="8">Browser, OS, region, selected source, response timing, and anonymous request IDs.</text><rect x="878" y="1207" width="50" height="28" rx="14" fill="#FF5D38"/><circle cx="914" cy="1221" r="10" fill="#F4F0E8"/><line x1="88" y1="1276" x2="934" y2="1276" stroke="#FFF" stroke-opacity=".07"/><text x="88" y="1310" fill="#77736E" font-family="DejaVu Sans" font-size="8">Never includes passwords, messages, review drafts, or your full watch history.</text><rect x="88" y="1324" width="174" height="46" rx="7" fill="#FF5D38"/><text x="175" y="1352" text-anchor="middle" fill="#FFF8F4" font-family="DejaVu Sans" font-size="9" font-weight="900">SUBMIT REPORT</text><text x="288" y="1352" fill="#A39F99" font-family="DejaVu Sans" font-size="9" font-weight="800">CANCEL</text>

