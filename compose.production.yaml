services:
  gateway:
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:2026.8.0
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-missing-tunnel-token}"]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    environment:
      DATABASE_URL: postgresql://consumit:${CONSUMIT_POSTGRES_PASSWORD:-missing-database-password}@postgres:5432/consumit
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-missing-restic-repository}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      BACKUP_HOST: ${BACKUP_HOST:-consumit-production}
    volumes:
      - type: bind
        source: ${RESTIC_PASSWORD_FILE:-./infra/secrets/missing-restic-password}
        target: /run/secrets/restic_password
        read_only: true
      - type: bind
        source: ${STORAGE_BOX_SSH_DIR:-./infra/secrets/missing-ssh-directory}
        target: /root/.ssh
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
