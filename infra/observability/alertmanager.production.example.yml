global:
  resolve_timeout: 5m
route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 30m
receivers:
  - name: telegram
    telegram_configs:
      - bot_token: replace-with-private-telegram-bot-token
        chat_id: 0
        parse_mode: ""
        send_resolved: true
        message: 'Consumit {{ .Status }}: {{ range .Alerts }}{{ .Labels.alertname }} {{ .Annotations.summary }}; {{ end }}'
