global:
  scrape_interval: 15s
  evaluation_interval: 1m
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/production-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: consumit-playback
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: consumit-host
    static_configs:
      - targets: ["node-exporter:9100"]
