# Development only: Docker reassigns container IPs on every restart, and a
# static upstream block would pin the first address forever (stale 502s
# after any api/web restart). Resolving per request through the embedded
# DNS keeps the gateway correct without reloads.
resolver 127.0.0.11 valid=10s;

# Development only: pass through the Next.js HMR websocket as well as plain
# HTTP so hot updates keep working when browsing through the gateway.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name consumit.online _;

  include /etc/nginx/consumit-request-limits.conf;

  # OAuth returns a one-time authorization code in the callback query.
  # Keep it out of gateway access and error logs.
  location = /v1/auth/google/callback {
    access_log off;
    error_log /dev/null;
    set $upstream_api http://api:3001;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Capabilities are opaque credentials; never record their query strings.
  location = /v1/playback/relay-manifest {
    access_log off;
    error_log /dev/null;
    set $upstream_api http://api:3001;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  # Three bounded provider tiers can take up to 60s to discover a source.
  location ~ ^/v1/(playback/|embed/session) {
    set $upstream_api http://api:3001;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
  }

  # Allow the 15s Admin inspection deadline to return its structured outcome.
  location = /v1/admin/providers/inspect {
    set $upstream_api http://api:3001;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  # The AnimeKai compute callback is the only internal route exposed at the
  # edge; it independently verifies its computation secret and rate limit.
  location = /v1/internal/animekai-pow {
    set $upstream_api http://api:3001;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  location ^~ /v1/internal/ { return 404; }

  location /v1/ {
    set $upstream_api http://api:3001;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  # Reserved until the product introduces an authenticated WebSocket surface.
  location ^~ /ws/ {
    return 404;
  }

  location / {
    set $upstream_web http://web-next:3000;
    proxy_pass $upstream_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
