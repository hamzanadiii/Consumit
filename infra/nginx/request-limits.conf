# Active routes accept bounded JSON; the retired multipart importer is absent.
client_max_body_size 1m;
error_page 413 = @request_too_large;

location @request_too_large {
  default_type application/json;
  add_header Cache-Control "private, no-store" always;
  add_header X-Request-ID $request_id always;
  return 413 '{"error":{"code":"BAD_REQUEST","message":"The request is too large. Reduce its size and try again.","requestId":"$request_id","retryable":false}}';
}
