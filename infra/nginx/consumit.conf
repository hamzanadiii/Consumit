# Container IPs change on every redeploy, and a static upstream block would
# pin the first address forever (stale 502s). Resolving per request
# through the embedded DNS keeps the gateway correct without reloads.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  server_name consumit.online _;

  # The API enforces a 25 MiB file limit. Leave room for multipart framing.
  client_max_body_size 26m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /v1/ {
    set $upstream_api http://api:3001;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  # Reserved until the product introduces an authenticated WebSocket surface.
  location ^~ /ws/ {
    return 404;
  }

  location / {
    set $upstream_web http://web:3000;
    proxy_pass $upstream_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
