# Add after playback wiring. Set a separate service secret; tracking stays off
# until migration, compatible API/web, and the sandboxed worker are checked.
services:
  api:
    environment:
      RELEASE_TRACKING_ENABLED: ${RELEASE_TRACKING_ENABLED:-false}
      RELEASE_WORKER_SECRET: ${RELEASE_WORKER_SECRET:?Set a dedicated release worker secret}

  release-worker:
    profiles: [releases]
    build:
      context: .
      target: release-worker
    environment:
      RELEASE_API_ORIGIN: http://api:3001
      RELEASE_APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      RELEASE_WORKER_SECRET: ${RELEASE_WORKER_SECRET:?Set a dedicated release worker secret}
      # The proxy preserves the public Host/origin while connecting internally.
      RELEASE_CONNECT_HOST: gateway
    user: node
    init: true
    read_only: true
    cap_drop: [ALL]
    # Chromium's user-namespace sandbox needs chroot; no SYS_ADMIN privilege.
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/releases/seccomp.json
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    shm_size: 256mb
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_started
    restart: unless-stopped
