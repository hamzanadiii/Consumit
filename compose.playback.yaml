# Opt-in playback wiring. Uses the providers listed in the local file.
# docker compose -f compose.yaml -f compose.playback.yaml --profile playback up -d --build api playback-valkey
services:
  playback-valkey:
    profiles: !reset []

  api:
    environment:
      PLAYBACK_ENABLED: "true"
      PLAYBACK_VALKEY_URL: valkey://playback-valkey:6379/0
      PLAYBACK_MEDIA_CONFIG: /run/consumit/providers.json
    volumes:
      - type: bind
        source: ./infra/playback/providers.local.json
        target: /run/consumit/providers.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      playback-valkey:
        condition: service_healthy
