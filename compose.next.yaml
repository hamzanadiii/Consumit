services:
  next-web:
    image: consumit-next-web:latest
    build:
      context: .
      target: next-web
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3080
        CONSUMIT_API_URL: http://api:3001
    ports:
      - "127.0.0.1:3080:3000"
    env_file:
      - path: ./.env
        required: false
      - path: ./apps/web/.env
        required: false
    environment:
      CONSUMIT_API_URL: http://api:3001
      CONSUMIT_DESIGN_LAB: "0"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  next-preview:
    image: consumit-next-web:latest
    profiles: [design-lab]
    ports:
      - "127.0.0.1:27917:3000"
    env_file:
      - path: ./.env
        required: false
      - path: ./apps/web/.env
        required: false
    environment:
      CONSUMIT_API_URL: http://api:3001
      CONSUMIT_DESIGN_LAB: "1"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
